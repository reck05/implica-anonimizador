[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "implica-anonimizador"
version = "0.1.0"
description = "Anonimizador local de documentos M&A para Implica CF"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "openpyxl>=3.1.2",
    "python-docx>=1.1.0",
    "python-pptx>=0.6.23",
    "pymupdf>=1.24.0",
    "spacy>=3.7.0",
    "rapidfuzz>=3.6.0",
    "pydantic>=2.6.0",
    "cryptography>=42.0.0",
]

[project.scripts]
implica-anon = "implica_anon.cli:app"

[tool.setuptools.packages.find]
include = ["implica_anon*"]
